org.gradle.jvmargs=-Xmx2048m
# GeneralsX @bugfix Android port 08/07/2026 (carried over from
# android/gradle.properties): Material Components transitively pulls in
# AndroidX libraries; Gradle's checkDebugAarMetadata fails the build
# outright if this is false while any AndroidX dependency is on the
# classpath.
android.useAndroidX=true
android.nonTransitiveRClass=true
