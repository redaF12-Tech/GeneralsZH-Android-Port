name: Merge MYSOREZ network-diagnostics with my changes

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest

    env:
      SOURCE_REPO: MYSOREZ/GeneralsZH-Android-Port
      SOURCE_BRANCH: claude/network-diagnostics
      MY_BRANCH: redaF12-Tech-patch-1
      MERGE_BRANCH: merge/mysorez-network-diagnostics

    steps:
      - name: Check SYNC_TOKEN
        run: |
          if [ -z "${{ secrets.SYNC_TOKEN }}" ]; then
            echo "SYNC_TOKEN is missing"
            exit 1
          fi

      - name: Prepare Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git init
          git remote add origin \
            "https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ github.repository }}.git"

          git remote add mysorez \
            "https://github.com/${SOURCE_REPO}.git"

      - name: Verify source and my branches
        run: |
          echo "Checking MYSOREZ branch..."
          git ls-remote --exit-code --heads \
            "https://github.com/${SOURCE_REPO}.git" \
            "${SOURCE_BRANCH}"

          echo "Checking my branch..."
          git ls-remote --exit-code --heads \
            origin \
            "${MY_BRANCH}"

      - name: Fetch branches
        run: |
          git fetch --no-tags mysorez \
            "${SOURCE_BRANCH}"

          git fetch --no-tags origin \
            "${MY_BRANCH}"

      - name: Create merge branch from MYSOREZ
        run: |
          git checkout -b "${MERGE_BRANCH}" \
            "FETCH_HEAD"

      - name: Merge my changes
        run: |
          git merge \
            --no-ff \
            --no-edit \
            -X theirs \
            "origin/${MY_BRANCH}"

      - name: Push merge branch
        run: |
          git push origin \
            "HEAD:${MERGE_BRANCH}"

      - name: Done
        run: |
          echo "========================================"
          echo "Merge branch created successfully:"
          echo "${MERGE_BRANCH}"
          echo "========================================"
