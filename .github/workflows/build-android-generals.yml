# Core/Generals 02/10/2026 Build the ORIGINAL C&C Generals engine (not Zero
# Hour) as a standalone Android APK — the separate com.generalsx.generals app
# living in Android/Generals/, with its own folder-picker launcher.
#
# Why a second workflow instead of a job in build-android.yml:
#   * Different engine target: g_generals (Generals/) instead of z_generals
#     (GeneralsMD/), configured with the SAME android-vulkan preset plus
#     -DRTS_BUILD_GENERALS=ON -DRTS_BUILD_ZEROHOUR=OFF.
#   * Different shell project: Android/Generals (its own Gradle root,
#     applicationId com.generalsx.generals) — never touches android/ (the
#     Zero Hour app), so the two APKs can't clobber each other's staged
#     jniLibs/java-sdl/assets.
#   * Different path filters: a Zero Hour-only change should not pay for a
#     Generals build and vice versa.
#
# The toolchain is intentionally byte-identical to build-android.yml (same
# pinned NDK/SDK/Gradle/vcpkg/DXVK), and the SDK/vcpkg/DXVK cache keys are
# SHARED with that workflow — those inputs don't depend on which engine is
# being built, so a warm cache from either workflow is valid for the other.
# Only the ccache prefix differs (different compile flags per engine).

name: Build Android (Generals)

permissions:
  contents: read
  # Needed by nothing right now (no artifact-cleanup step here — the Zero
  # Hour workflow's "Delete superseded artifacts" step already sweeps the
  # whole repository, artifacts included). Declared so adding a gh api call
  # later doesn't silently 403 under an explicit permissions: block.
  actions: write

on:
  # Same dev-loop reasoning as build-android.yml: build locally before
  # pushing, so no push: trigger — pull_request (path-scoped) + manual runs
  # only, to keep Actions usage proportional to what is actually looked at.
  pull_request:
    branches:
      - main
    paths:
      - 'Generals/**'
      - 'Core/**'
      - 'Dependencies/**'
      - 'cmake/**'
      - 'Android/Generals/**'
      - 'scripts/build/android/**'
      - 'Patches/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - '.github/workflows/build-android-generals.yml'
  workflow_dispatch:
    inputs:
      version_name:
        type: string
        description: "Override versionName (e.g. 1.0.1). Leave blank to use the committed default (Android/Generals/app/build.gradle)."
        default: ""
      version_code:
        type: string
        description: "Override versionCode (must be higher than any build already installed on your device). Leave blank to use the committed default."
        default: ""

jobs:
  build-android-generals:
    name: apk-generals@android-vulkan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRESET: android-vulkan
      # Pinned exact NDK release (not "latest") so a cross-compile that works
      # today doesn't silently pick up a different toolchain in six months.
      NDK_VERSION: "27.2.12479018"
      GRADLE_VERSION: "8.9"
      # cmdline-tools zip (pinned + sha1 from Google's repository2-3.xml manifest);
      # its sdkmanager then installs the NDK/platform/build-tools above.
      CMDLINE_TOOLS_VERSION: "13114758"
      CMDLINE_TOOLS_SHA1: "5fdcc763663eefb86a5b8879697aa6088b041e70"
      # Same vcpkg pin as build-android.yml: vcpkg.json overrides ffmpeg to
      # 8.1.1#2, which only resolves on a version database new enough to
      # contain that override (see the long comment there).
      VCPKG_COMMIT: "42e4e33e1505c9f47b58c21e0f557c1571b751ee"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout DXVK fork submodule
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 references/fbraz3-dxvk
          # DXVK's OWN submodules (SPIRV-Headers, Vulkan-Headers,
          # libdisplay-info) — meson dies with "Missing SPIRV-Headers" without
          # them; the superproject init above is not recursive.
          git -C references/fbraz3-dxvk submodule update --init --depth 1
          # Pinned commit the superproject's tree points at (reads the gitlink,
          # not the submodule's own shallow history) — used below as a cache key
          # component so a re-pin of the submodule busts the DXVK build cache.
          echo "DXVK_REF=$(git rev-parse HEAD:references/fbraz3-dxvk)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-24.04 runner images do NOT ship an Android SDK — install
      # cmdline-tools from a pinned, checksummed zip and let its own
      # sdkmanager pull the NDK, platform and build-tools. Identical keys to
      # build-android.yml on purpose: the SDK is engine-agnostic, so a warm
      # cache from the Zero Hour workflow is exactly what this one needs.
      - name: Restore Android SDK cache
        id: cache-android-sdk
        uses: actions/cache/restore@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35
      - name: Install Android SDK (cmdline-tools + NDK + platform + build-tools)
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${{ env.CMDLINE_TOOLS_VERSION }}_latest.zip"
          echo "${{ env.CMDLINE_TOOLS_SHA1 }}  /tmp/cmdline-tools.zip" | sha1sum -c -
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          # sdkmanager requires the "<sdk>/cmdline-tools/latest" layout to locate its SDK root
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          sudo chown -R "$(id -u):$(id -g)" /opt/android-sdk
          rm /tmp/cmdline-tools.zip
          SDKMANAGER=/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;${{ env.NDK_VERSION }}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Export Android SDK environment
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          test -f "/opt/android-sdk/ndk/${{ env.NDK_VERSION }}/build/cmake/android.toolchain.cmake" \
            || { echo "::error::NDK toolchain file missing after install"; exit 1; }

      # Gradle: this project intentionally doesn't commit a wrapper (binary jar),
      # so use Gradle's own official action — exactly what
      # package-android-generals.sh looks for (`gradle` on PATH).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install build tools (meson, ninja, pkg-config, glslang, ccache)
        run: |
          # apt's meson, not pip: ubuntu-latest (24.04) marks the system Python
          # as externally-managed (PEP 668), so a plain `pip install` refuses
          # to run outside a venv. Drop the third-party lists the runner image
          # carries (Chrome/Microsoft) whose indexes are periodically served
          # corrupt — a "Hash Sum mismatch" there kills the whole build under
          # `bash -e`. Retry once for a genuinely transient mirror hiccup.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq || sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build meson pkg-config glslang-tools ccache
          meson --version
          ninja --version
          glslangValidator --version | head -1
          ccache --version | head -1

      # Separate ccache prefix from build-android.yml: the two engines compile
      # the shared Core sources with different RTS_* defines, so a mixed cache
      # would thrash direct-mode hits. (actions/cache never overwrites an
      # existing exact key; github.run_id keeps each save unique.)
      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-android-generals-${{ github.run_id }}
          restore-keys: |
            ccache-android-generals-

      - name: Configure ccache
        run: |
          set -euo pipefail
          ccache --set-config=max_size=3G
          # Cross-compiles (host clang, target arm64-android via NDK sysroot)
          # confuse ccache's default mtime-based direct mode across different
          # checkouts; content hashing keeps hits reliable.
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache/restore@v5
        with:
          # /opt/vcpkg = the tool + ports tree; ~/.cache/vcpkg = the BINARY
          # cache of already-built packages. Shared key with build-android.yml:
          # the cross-built dependencies (ffmpeg/openssl/curl for arm64-android)
          # are identical for both engines.
          path: |
            /opt/vcpkg
            ~/.cache/vcpkg
          key: vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}
          restore-keys: |
            vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      # DXVK build cache: shared key with build-android.yml (same submodule
      # pin + same patches + same cross-file inputs + same checkout path
      # layout), and the meson state is engine-agnostic — DXVK doesn't know
      # which of RTS_BUILD_GENERALS/RTS_BUILD_ZEROHOUR is on.
      - name: Restore DXVK build cache
        id: cache-dxvk
        uses: actions/cache/restore@v5
        with:
          path: build/${{ env.PRESET }}/_deps/dxvk-build-android
          # github.repository is part of the key: meson's cached state bakes
          # the absolute checkout path into its private build state, so a repo
          # rename must invalidate this cache instead of silently corrupting
          # it (the exact failure the ZH workflow's comment documents).
          key: dxvk-android-${{ runner.os }}-${{ github.repository }}-${{ env.DXVK_REF }}-${{ hashFiles('Patches/dxvk-android.patch', 'Patches/dxvk-ios.patch', 'cmake/dx8.cmake', 'cmake/meson-arm64-android-cross.ini.in') }}

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          # A cache restored from an older run may hold a checkout at a stale
          # commit — verify and re-pin instead of trusting the cache blindly.
          if [ ! -d /opt/vcpkg/.git ]; then
            git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg
          fi
          CURRENT="$(git -C /opt/vcpkg rev-parse HEAD || echo none)"
          if [ "$CURRENT" != "${{ env.VCPKG_COMMIT }}" ]; then
            git -C /opt/vcpkg fetch origin ${{ env.VCPKG_COMMIT }}
            git -C /opt/vcpkg checkout ${{ env.VCPKG_COMMIT }}
            rm -f /opt/vcpkg/vcpkg  # force tool re-bootstrap matching the tree
          fi
          if [ ! -f /opt/vcpkg/vcpkg ]; then
            /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          echo "VCPKG_ROOT=/opt/vcpkg" >> "$GITHUB_ENV"

      # set -o pipefail on every `cmd | tee`: without it the step's exit code
      # is tee's (always 0) and a fatal configure error sails straight past
      # into "success" — the pipeline-masking failure the porting playbook
      # warns about.
      #
      # The -D flags below OVERRIDE the preset's RTS_BUILD_GENERALS: OFF
      # (command-line -D wins over preset cacheVariables), turning this into
      # an original-Generals-only build: g_generals -> libmain.so, no Zero
      # Hour engine in the tree at all.
      #
      # RTS_BUILD_GENERALS_TOOLS/EXTRAS must be turned OFF explicitly: that
      # option defaults ON (cmake/config-build.cmake) and only activates once
      # RTS_BUILD_GENERALS is ON — the preset never had to disable it before.
      # WorldBuilder/GUIEdit/W3DView are desktop mod tools with no Android
      # build; the preset already disables the Zero Hour equivalents for the
      # same reason.
      #
      # The assert step right after proves the cache actually took every
      # override rather than trusting argument precedence.
      - name: Configure CMake (Android, original Generals only)
        run: |
          set -o pipefail
          mkdir -p logs
          cmake --preset ${{ env.PRESET }} \
            -DRTS_BUILD_GENERALS=ON \
            -DRTS_BUILD_ZEROHOUR=OFF \
            -DRTS_BUILD_GENERALS_TOOLS=OFF \
            -DRTS_BUILD_GENERALS_EXTRAS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_CI_BUILD_NUMBER=${{ github.run_number }} \
            2>&1 | tee logs/configure_android_generals.log

      - name: Assert the Generals-only configuration took
        run: |
          set -euo pipefail
          CACHE="build/${{ env.PRESET }}/CMakeCache.txt"
          grep -q '^RTS_BUILD_GENERALS:BOOL=ON' "$CACHE" \
            || { echo "::error::RTS_BUILD_GENERALS is not ON in $CACHE"; grep '^RTS_BUILD' "$CACHE"; exit 1; }
          grep -q '^RTS_BUILD_ZEROHOUR:BOOL=OFF' "$CACHE" \
            || { echo "::error::RTS_BUILD_ZEROHOUR is not OFF in $CACHE — this run would build the Zero Hour engine."; grep '^RTS_BUILD' "$CACHE"; exit 1; }
          grep -q '^RTS_BUILD_GENERALS_TOOLS:BOOL=OFF' "$CACHE" \
            || { echo "::error::RTS_BUILD_GENERALS_TOOLS is not OFF in $CACHE — desktop mod tools would be configured into this Android build."; grep '^RTS_BUILD' "$CACHE"; exit 1; }
          echo "OK: original-Generals-only configuration confirmed."

      # ninja -k 0: keep going past failures so ONE run surfaces every
      # cross-compile error instead of one per round-trip; the exit code still
      # fails the step when anything broke.
      #
      # main_hook/file_redirect_hook/gsl_alloc_hook/hook_impl
      # (cmake/adrenotools.cmake): dlopen()'d by path at runtime, not a
      # link-time dependency of g_generals, so a targeted build skips them
      # unless named explicitly — package-android-generals.sh requires all
      # four to already exist.
      - name: Build g_generals (libmain.so) + DXVK d3d8/d3d9
        run: |
          set -o pipefail
          mkdir -p logs
          cmake --build build/${{ env.PRESET }} --target g_generals dxvk_d3d8_install \
            main_hook file_redirect_hook gsl_alloc_hook hook_impl -- -k 0 2>&1 | tee logs/build_android_generals.log
          ccache --show-stats

      - name: Verify artifacts
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          # Deterministic path from the target's own OUTPUT_NAME (mirrors the
          # ZH workflow's fix): a broad `find ... -name libmain.so | head -1`
          # has no ordering guarantee once the build dir accumulates more than
          # one match across cached/incremental runs, and head -1 can silently
          # grab a stale copy instead of the one ninja just linked.
          GAME_LIB="build/${{ env.PRESET }}/Generals/Code/Main/libmain.so"
          if [ ! -f "$GAME_LIB" ]; then echo "::error::libmain.so not found at $GAME_LIB"; exit 1; fi
          # I/O visibility race on the runner: the prior step can exit 0 while
          # the linker's writes aren't visible to a process started
          # microseconds later. Retry a few times with a short sleep before
          # failing for real; a genuinely wrong-arch binary still fails every
          # attempt and correctly errors out.
          READELF_OK=0
          for attempt in 1 2 3 4 5; do
            if "$READELF" -h "$GAME_LIB" 2>/dev/null | grep -q AArch64; then
              READELF_OK=1
              break
            fi
            sleep 1
          done
          [ "$READELF_OK" = "1" ] || { echo "::error::libmain.so is not AArch64"; exit 1; }
          for lib in libdxvk_d3d8.so libdxvk_d3d9.so; do
            [ -f "build/${{ env.PRESET }}/$lib" ] || { echo "::error::$lib missing"; exit 1; }
          done
          strings "build/${{ env.PRESET }}/libdxvk_d3d9.so" | grep -q Sdl3WsiDriver || {
            echo "::error::libdxvk_d3d9.so built without the SDL3 WSI (silent fallback)"; exit 1; }
          echo "Artifacts verified: AArch64 libmain.so (g_generals) + DXVK with SDL3 WSI"

      # Text symbol table captured BEFORE stripping, so a device tombstone
      # from this build can still be symbolized (address -> function+offset).
      # Unstripped libmain.so itself is far too big for the repo's Actions
      # storage quota — the few-MB text table is what those investigations
      # actually used. 90-day retention: a crash report routinely arrives
      # after the APK's 7-day artifact has expired.
      - name: Collect symbol table (before stripping)
        run: |
          set -e
          TOOLS="$(dirname "$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-nm | head -1)")"
          LIB="build/${{ env.PRESET }}/Generals/Code/Main/libmain.so"
          mkdir -p symbols
          OUT="symbols/libmain-generals-run${{ github.run_number }}.symbols.txt"
          BUILD_ID="$(readelf -n "$LIB" 2>/dev/null | sed -n 's/.*Build ID: \([0-9a-f]*\).*/\1/p' | head -1)"
          {
            echo "# libmain.so (original Generals) symbols -- run ${{ github.run_number }}, commit ${{ github.sha }}"
            echo "# Match this BuildID against the tombstone's before trusting any address."
            echo "# BuildID: ${BUILD_ID:-UNKNOWN}"
            "$TOOLS/llvm-readelf" --notes --program-headers "$LIB"
            echo "# --- defined symbols: address size type name ---"
            "$TOOLS/llvm-nm" --defined-only --numeric-sort --print-size --demangle "$LIB"
          } > "$OUT"
          # A table that came out empty is worse than no table: it would ship
          # attached to a Release looking authoritative. Say so.
          SYMS=$("$TOOLS/llvm-nm" --defined-only "$LIB" 2>/dev/null | wc -l)
          echo "Symbols captured: ${SYMS}"
          if [ "$SYMS" -lt 1000 ]; then
            echo "::warning::libmain.so yielded only ${SYMS} symbols — crash logs from this build will not symbolize."
          fi
          gzip -9 "$OUT"
          ls -la symbols/

      # Strip what AGP's own strip task won't (it fails silently on our
      # custom-built libraries): keeps the APK around ~45 MB instead of
      # ~115 MB. libdxvk_d3d8.so/libdxvk_d3d9.so are deliberately excluded:
      # stripping them crashes DXVK's draw path on real hardware (see
      # android/app/build.gradle's keepDebugSymbols for the full story).
      - name: Strip debug symbols
        run: |
          STRIP="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-strip | head -1)"
          for lib in "build/${{ env.PRESET }}/Generals/Code/Main/libmain.so" \
                     "build/${{ env.PRESET }}/_deps/sdl3-build/libSDL3.so" \
                     "build/${{ env.PRESET }}/_deps/sdl3_image-build/libSDL3_image.so" \
                     "build/${{ env.PRESET }}/_deps/openal_soft-build/libopenal.so" \
                     "build/${{ env.PRESET }}/libgamespy.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/libadrenotools.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libgsl_alloc_hook.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libhook_impl.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libmain_hook.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libfile_redirect_hook.so"; do
            [ -f "$lib" ] && "$STRIP" --strip-unneeded "$lib"
          done

      - name: Set artifact version
        id: artifact
        run: |
          # Version numbers are manually managed (Android/Generals/app/
          # build.gradle). A manual "Run workflow" dispatch can still
          # override them for a one-off build via the version_name /
          # version_code inputs; a normal PR build passes neither, so Gradle
          # falls back to whatever is committed in build.gradle.
          echo "version_code=${{ inputs.version_code || '' }}" >> "$GITHUB_OUTPUT"
          echo "version_name=${{ inputs.version_name || '' }}" >> "$GITHUB_OUTPUT"
          echo "apk_name=GeneralsXGenerals-android-run${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Package APK
        env:
          # package-android-generals.sh uses these to stage jniLibs/, the SDL3
          # Java glue and fonts into Android/Generals, then invokes Gradle.
          # The fixed debug.keystore committed in Android/Generals/app/ is
          # what makes consecutive CI builds installable as updates over each
          # other (provided versionCode was bumped by hand).
          GX_ANDROID_STAGING: ${{ github.workspace }}/android-staging
          GX_ANDROID_VERSION_CODE: ${{ steps.artifact.outputs.version_code }}
          GX_ANDROID_VERSION_NAME: ${{ steps.artifact.outputs.version_name }}
        run: |
          ./scripts/build/android/package-android-generals.sh

      - name: Locate APK
        id: locate
        run: |
          APK="Android/Generals/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then echo "::error::APK not found at $APK"; exit 1; fi
          cp "$APK" "${{ steps.artifact.outputs.apk_name }}"
          echo "path=${{ steps.artifact.outputs.apk_name }}" >> "$GITHUB_OUTPUT"

      # Every non-system DT_NEEDED of libmain.so must be a real file inside
      # the APK's lib/arm64-v8a/, or the build is not actually shippable —
      # a missing one crashes with "dlopen failed" on the first launch on any
      # real device (the exact failure that shipped once on the ZH app when
      # only a warning was printed).
      - name: Verify APK contains every library libmain.so needs
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          APK="${{ steps.locate.outputs.path }}"
          WORKDIR="$(mktemp -d)"
          unzip -q "${APK}" 'lib/arm64-v8a/*' -d "${WORKDIR}"
          echo "Packaged libraries:"
          ls "${WORKDIR}/lib/arm64-v8a/"
          NEEDED="$("${READELF}" -d "${WORKDIR}/lib/arm64-v8a/libmain.so" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/')"
          missing=0
          for lib in ${NEEDED}; do
            case "${lib}" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libGLESv*|libEGL.so|libvulkan.so|libOpenSLES.so|libaaudio.so|libmediandk.so|libcamera2ndk.so|libjnigraphics.so|libnativewindow.so|libsync.so|libz.so)
                continue ;;  # system libs every device provides via the NDK stable ABI
            esac
            if [ ! -f "${WORKDIR}/lib/arm64-v8a/${lib}" ]; then
              echo "::error::libmain.so needs '${lib}' at runtime but it is not packaged in the APK"
              missing=1
            fi
          done
          rm -rf "${WORKDIR}"
          if [ "${missing}" -ne 0 ]; then
            echo "::error::APK is missing required native libraries — it would crash with dlopen failed on any real device."
            exit 1
          fi
          echo "OK: every DT_NEEDED of libmain.so is present in the APK."

      # 7 days: an APK is ~110 MB and the shared Actions quota is 0.5 GB —
      # long enough for a tester to grab a build, short enough to not starve
      # the quota (the ZH workflow's repo-wide cleanup step sweeps older runs
      # anyway, this one included).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.apk_name }}
          path: ${{ steps.locate.outputs.path }}
          retention-days: 7

      - name: Upload symbol table artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-generals-symbols-run${{ github.run_number }}
          path: symbols/
          retention-days: 90

      - name: Collect dependency build logs for diagnosis
        if: always()
        run: |
          mkdir -p logs
          # vcpkg writes the real failure details one level below the summary
          # that lands in the configure log — pull them into the artifact.
          cp build/${{ env.PRESET }}/vcpkg-manifest-install.log logs/ 2>/dev/null || true
          if [ -d /opt/vcpkg/buildtrees ]; then
            find /opt/vcpkg/buildtrees -maxdepth 2 -name "*.log" -newer .git -exec cp {} logs/ \; 2>/dev/null || true
          fi
          # DXVK meson configure log, when that stage was reached
          cp build/${{ env.PRESET }}/_deps/dxvk-build-android/meson-logs/meson-log.txt logs/dxvk-meson-log.txt 2>/dev/null || true
          ls -la logs/ || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-generals-build-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      # Save caches even when the job failed (restore steps above use plain
      # actions/cache/restore, whose automatic post-step save only runs on
      # success — and this workflow is expected to fail repeatedly while the
      # Generals engine cross-compile is being brought up; every failed run
      # would otherwise rebuild ffmpeg/openssl/DXVK from scratch). Guard each
      # save so a run that restored an exact-key hit doesn't fail re-saving it.
      - name: Save Android SDK cache
        if: always() && steps.cache-android-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35

      - name: Save vcpkg cache
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /opt/vcpkg
            ~/.cache/vcpkg
          key: vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}

      - name: Save DXVK build cache
        if: always() && steps.cache-dxvk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/${{ env.PRESET }}/_deps/dxvk-build-android
          key: dxvk-android-${{ runner.os }}-${{ github.repository }}-${{ env.DXVK_REF }}-${{ hashFiles('Patches/dxvk-android.patch', 'Patches/dxvk-ios.patch', 'cmake/dx8.cmake', 'cmake/meson-arm64-android-cross.ini.in') }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ccache-android-generals-${{ github.run_id }}
